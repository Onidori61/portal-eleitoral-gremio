<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hub da Comissão</title><link rel="stylesheet" href="/styles.css"></head><body><main class="section"><h1>Hub da Comissão Eleitoral</h1><p>Área restrita. O token é usado somente nesta sessão e não é salvo.</p><label>Token da Comissão <input id="token" type="password" autocomplete="off"></label><section class="card"><h2>Importar eleitores</h2><input id="csv" type="file" accept=".csv,text/csv"><button class="button" id="import">Validar e importar</button><p id="import-message" role="status"></p></section><section class="card"><h2>Enviar imagem</h2><input id="image" type="file" accept="image/*"><button class="button" id="upload">Enviar ao ImgBB</button><p id="upload-message" role="status"></p></section></main><script type="module" src="/hub.js"></script></body></html>
